name: AppAccessToggle
options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
targets:
  AppAccessToggle:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
    resources:
      - path: Resources/Assets.xcassets
    entitlements:
      path: AppAccessToggle.entitlements
    settings:
      base:
        PRODUCT_NAME: AppAccessToggle
        # TODO: change to a bundle identifier you own before building.
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.appaccesstoggle
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: "Access Toggle"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait"
    schemes:
      AppAccessToggle:
        build:
          targets:
            AppAccessToggle: all
        run:
          config: Debug
        archive:
          config: Release
